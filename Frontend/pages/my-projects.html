<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Projects | Freelancer Marketplace</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f6ff;
            color: #222;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 300px;
            height: 100vh;

            background:
                linear-gradient(
                    160deg,
                    #4f46e5,
                    #6d4ad8 55%,
                    #7c3aed
                );

            color: white;

            padding: 28px 18px;

            overflow-y: auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h2 {
            font-size: 24px;
        }

        .logo p {
            font-size: 12px;
            opacity: .8;
            margin-top: 5px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;

            color: white;

            text-decoration: none;

            padding: 13px 16px;

            margin: 6px 0;

            border-radius: 10px;

            transition: .2s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255,255,255,.18);
        }

        .logout {
            margin-top: 20px;

            border-top:
                1px solid rgba(255,255,255,.2);

            padding-top: 20px;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .main-content {
            margin-left: 300px;

            width: calc(100% - 300px);

            min-height: 100vh;

            padding: 35px 40px;
        }

        .page-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #27204f;

            font-size: 30px;
        }

        .page-header p {
            color: #777;

            margin-top: 7px;
        }


        /* =========================
           BUTTON
        ========================= */

        .btn {
            border: none;

            padding: 12px 20px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

            transition: .2s;
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    #5146e5,
                    #7c3aed
                );

            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px
                rgba(81,70,229,.25);
        }

        .btn-secondary {
            background: #ede9fe;

            color: #5b21b6;
        }

        .btn-success {
            background: #dcfce7;

            color: #15803d;
        }

        .btn-danger {
            background: #fee2e2;

            color: #b91c1c;
        }


        /* =========================
           PROJECT GRID
        ========================= */

        .projects-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 22px;
        }


        /* =========================
           PROJECT CARD
        ========================= */

        .project-card {
            background: white;

            border-radius: 18px;

            padding: 24px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.07);

            transition: .2s;

            overflow: hidden;
        }

        .project-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,.09);
        }

        .project-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 12px;
        }

        .project-title {
            color: #312e81;

            font-size: 21px;

            line-height: 1.3;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            text-transform: capitalize;

            white-space: nowrap;
        }

        .status-open {
            background: #eff6ff;
            color: #2563eb;
        }

        .status-assigned {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-in_progress {
            background: #fefce8;
            color: #a16207;
        }

        .status-completed {
            background: #ecfdf5;
            color: #047857;
        }

        .status-cancelled {
            background: #fef2f2;
            color: #b91c1c;
        }


        /* =========================
           CATEGORY
        ========================= */

        .category {
            display: inline-block;

            background: #ede9fe;

            color: #5b21b6;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 12px;

            margin-bottom: 15px;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description {
            color: #666;

            line-height: 1.6;

            margin-bottom: 18px;

            display: -webkit-box;

            -webkit-line-clamp: 3;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        /* =========================
           PROJECT INFO
        ========================= */

        .project-info {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 18px;
        }

        .info-box {
            background: #f8f7ff;

            padding: 12px;

            border-radius: 10px;
        }

        .info-box small {
            display: block;

            color: #777;

            font-size: 12px;
        }

        .info-box strong {
            display: block;

            margin-top: 5px;

            color: #333;
        }


        /* =========================
           CARD FOOTER
        ========================= */

        .project-footer {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 12px;

            padding-top: 16px;

            border-top:
                1px solid #eee;
        }

        .project-actions {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }

        .project-actions .btn {
            padding: 9px 13px;

            font-size: 12px;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            background: white;

            border-radius: 18px;

            padding: 70px 25px;

            text-align: center;

            color: #777;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.06);

            grid-column: 1 / -1;
        }

        .empty h2 {
            color: #312e81;

            margin-bottom: 10px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(20,16,50,.55);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;

            width: 100%;

            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.2);
        }

        .modal-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;
        }

        .modal-header h2 {
            color: #312e81;
        }

        .close {
            border: none;

            background: #f3f4f6;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;

            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            padding: 12px 13px;

            border:
                1px solid #ddd;

            border-radius: 9px;

            outline: none;

            font-family: inherit;

            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(99,102,241,.1);
        }

        .form-group textarea {
            min-height: 120px;

            resize: vertical;
        }

        .form-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;
        }


        /* =========================
           BIDS MODAL
        ========================= */

        .bids-container {
            margin-top: 10px;
        }

        .bid-card {
            background: #f8f7ff;

            border-radius: 12px;

            padding: 17px;

            margin-bottom: 12px;

            border:
                1px solid #eee;
        }

        .bid-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 10px;

            margin-bottom: 10px;
        }

        .bid-header h3 {
            color: #312e81;

            font-size: 17px;
        }

        .bid-amount {
            color: #15803d;

            font-size: 18px;

            font-weight: bold;
        }

        .bid-proposal {
            color: #666;

            line-height: 1.5;

            margin: 10px 0;
        }

        .bid-date {
            color: #888;

            font-size: 12px;

            margin-bottom: 12px;
        }

        .bid-actions {
            display: flex;

            gap: 8px;
        }


        /* =========================
           TOAST
        ========================= */

        .toast {

            position: fixed;

            right: 25px;

            bottom: 25px;

            background: #312e81;

            color: white;

            padding: 14px 20px;

            border-radius: 10px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.18);

            display: none;

            z-index: 2000;
        }

        .toast.show {
            display: block;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 1000px) {

            .sidebar {
                width: 230px;
            }

            .main-content {
                margin-left: 230px;

                width:
                    calc(100% - 230px);
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }


        @media(max-width: 650px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;
            }

            .main-content {

                margin-left: 0;

                width: 100%;

                padding:
                    25px 18px;
            }

            .page-header {

                flex-direction: column;

                align-items: flex-start;
            }

            .project-info {

                grid-template-columns: 1fr;
            }

            .project-footer {

                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>

<!-- =====================================================

===================================================== -->

<div
    id="createModal"
    class="modal">

    <div class="modal-content">


        <div class="modal-header">

            <h2>

    class="toast">

<script>


/* =====================================================
   USER
===================================================== */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


/* Only client can access My Projects */

if (!user) {

    window.location.href =
        "login.html";

}


if (
    user &&
    user.role !== "client"
) {

    window.location.href =
        "projects.html";

}


/* =====================================================
   LOAD PROJECTS
===================================================== */

async function loadProjects() {

    const container =
        document.getElementById(
            "projectsContainer"
        );


    container.innerHTML = `
        <div class="empty">
            <h2>Loading Projects...</h2>
        </div>
    `;


    try {

        const response =
            await fetch(
                `/api/projects/my/${user.user_id}`
            );


        const data =
            await response.json();


        if (!data.success) {

            container.innerHTML = `
                <div class="empty">

                    <h2>
                        Failed to Load Projects
                    </h2>

                    <p>
                        ${escapeHTML(
                            data.message ||
                            "Something went wrong."
                        )}
                    </p>

                </div>
            `;

            return;
        }


        const projects =
            data.projects || [];


        if (projects.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <h2>
                        No Projects Yet
                    </h2>

                    <p>
                        Create your first project
                        and start receiving bids.
                    </p>

                    <button
                        class="btn btn-primary"
                        style="margin-top:18px;"
                        onclick="openCreateModal()">

                        + Post New Project

                    </button>

                </div>
            `;

            return;
        }


        container.innerHTML =
            projects.map(
                project =>
                    createProjectCard(project)
            ).join("");


    } catch (error) {

        console.error(
            "Load Projects Error:",
            error
        );


        container.innerHTML = `
            <div class="empty">

                <h2>
                    Server Error
                </h2>

                <p>
                    Could not connect to the server.
                </p>

            </div>
        `;

    }

}


/* =====================================================
   PROJECT CARD
===================================================== */

function createProjectCard(project) {

    const statusClass =
        `status-${project.status}`;


    let actions = "";


    /* OPEN PROJECT */

    if (project.status === "open") {

        actions = `

            <button
                class="btn btn-secondary"
                onclick="viewBids(${project.project_id})">

                View Bids

            </button>

        `;

    }


    /* ASSIGNED */

    else if (
        project.status === "assigned" ||
        project.status === "in_progress"
    ) {

        actions = `

            <button
                class="btn btn-secondary"
                onclick="viewBids(${project.project_id})">

                View Bids

            </button>


            <button
                class="btn btn-success"
                onclick="completeProject(${project.project_id})">

                Mark Completed

            </button>

        `;

    }


    /* COMPLETED */

    else if (
        project.status === "completed"
    ) {

        actions = `

            <button
                class="btn btn-success"
                disabled>

                ✓ Completed

            </button>

        `;

    }


    return `

        <div class="project-card">


            <div class="project-top">

                <h2 class="project-title">

                    ${escapeHTML(
                        project.title
                    )}

                </h2>


                <span
                    class="status ${statusClass}">

                    ${formatStatus(
                        project.status
                    )}

                </span>

            </div>


            <span class="category">

                ${escapeHTML(
                    project.category_name ||
                    "General"
                )}

            </span>


            <p class="description">

                ${escapeHTML(
                    project.description ||
                    "No description available."
                )}

            </p>


            <div class="project-info">


                <div class="info-box">

                    <small>
                        Budget
                    </small>

                    <strong>
                        $${Number(
                            project.budget || 0
                        ).toFixed(2)}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Deadline
                    </small>

                    <strong>
                        ${formatDate(
                            project.deadline
                        )}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Category
                    </small>

                    <strong>
                        ${escapeHTML(
                            project.category_name ||
                            "General"
                        )}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Created
                    </small>

                    <strong>
                        ${formatDate(
                            project.created_at
                        )}
                    </strong>

                </div>


            </div>


            <div class="project-footer">

                <span
                    style="
                        color:#888;
                        font-size:13px;
                    ">

                    Project #${project.project_id}

                </span>


                <div class="project-actions">

                    ${actions}

                </div>

            </div>


        </div>

    `;

}


/* =====================================================
   CATEGORY
===================================================== */

async function loadCategories() {

    const select =
        document.getElementById(
            "category"
        );


    if (!select) return;


    try {

        const response =
            await fetch(
                "/api/categories"
            );


        const data =
            await response.json();


        if (!data.success) {

            select.innerHTML = `
                <option value="">
                    Failed to load categories
                </option>
            `;

            return;
        }


        select.innerHTML = `
            <option value="">
                Select Category
            </option>
        `;


        data.categories.forEach(
            category => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    category.category_id;


                option.textContent =
                    category.category_name;


                select.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        console.error(
            "Category Error:",
            error
        );


        select.innerHTML = `
            <option value="">
                Failed to load categories
            </option>
        `;

    }

}


/* =====================================================
   CREATE PROJECT
===================================================== */

document
    .getElementById(
        "createProjectForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const title =
                document.getElementById(
                    "projectTitle"
                ).value.trim();


            const categoryId =
                document.getElementById(
                    "category"
                ).value;


            const description =
                document.getElementById(
                    "projectDescription"
                ).value.trim();


            const budget =
                document.getElementById(
                    "projectBudget"
                ).value;


            const deadline =
                document.getElementById(
                    "projectDeadline"
                ).value;


            if (!title ||
                !categoryId ||
                !description ||
                !budget ||
                !deadline) {

                showToast(
                    "Please fill all fields."
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/projects",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                client_id:
                                    user.user_id,

                                category_id:
                                    Number(
                                        categoryId
                                    ),

                                title,

                                description,

                                budget:
                                    Number(
                                        budget
                                    ),

                                deadline

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    showToast(
                        data.message ||
                        "Failed to create project."
                    );

                    return;

                }


                showToast(
                    "Project created successfully!"
                );


                closeCreateModal();


                document
                    .getElementById(
                        "createProjectForm"
                    )
                    .reset();


                await loadProjects();


            } catch (error) {

                console.error(error);

                showToast(
                    "Server error. Please try again."
                );

            }

        }
    );


/* =====================================================
   VIEW BIDS
===================================================== */

async function viewBids(projectId) {

    const modal =
        document.getElementById(
            "bidsModal"
        );


    const container =
        document.getElementById(
            "bidsContainer"
        );


    modal.classList.add("show");


    container.innerHTML = `
        <div class="empty"
             style="
                box-shadow:none;
                padding:30px;
             ">

            Loading bids...

        </div>
    `;


    try {

        const response =
            await fetch(
                `/api/bids/project/${projectId}`
            );


        const data =
            await response.json();


        if (!data.success) {

            container.innerHTML = `
                <div class="empty"
                     style="
                        box-shadow:none;
                        padding:30px;
                     ">

                    ${escapeHTML(
                        data.message ||
                        "Failed to load bids."
                    )}

                </div>
            `;

            return;
        }


        const bids =
            data.bids || [];


        if (bids.length === 0) {

            container.innerHTML = `
                <div class="empty"
                     style="
                        box-shadow:none;
                        padding:30px;
                     ">

                    <h2>
                        No Bids Yet
                    </h2>

                    <p>
                        Freelancers have not
                        bid on this project yet.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML =
            bids.map(
                bid =>
                    createBidCard(
                        bid,
                        projectId
                    )
            ).join("");


    } catch (error) {

        console.error(error);


        container.innerHTML = `
            <div class="empty"
                 style="
                    box-shadow:none;
                    padding:30px;
                 ">

                Failed to connect to server.

            </div>
        `;

    }

}


/* =====================================================
   BID CARD
===================================================== */

function createBidCard(
    bid,
    projectId
) {

    let action = "";


    if (
        bid.status === "pending"
    ) {

        action = `

            <button
                class="btn btn-success"
                onclick="
                    acceptBid(
                        ${bid.bid_id},
                        ${projectId}
                    )
                ">

                Accept Bid

            </button>

        `;

    }


    return `

        <div class="bid-card">


            <div class="bid-header">

                <div>

                    <h3>

                        ${escapeHTML(
                            bid.freelancer_name
                        )}

                    </h3>

                    <small
                        style="color:#777;">

                        ${escapeHTML(
                            bid.freelancer_email
                        )}

                    </small>

                </div>


                <div class="bid-amount">

                    $${Number(
                        bid.bid_amount || 0
                    ).toFixed(2)}

                </div>

            </div>


            <div class="bid-proposal">

                ${escapeHTML(
                    bid.proposal ||
                    "No proposal provided."
                )}

            </div>


            <div class="bid-date">

                Submitted:
                ${formatDateTime(
                    bid.bid_date
                )}

            </div>


            <div>

                <span
                    class="status
                    status-${bid.status}">

                    ${formatStatus(
                        bid.status
                    )}

                </span>

            </div>


            ${
                action
                ?
                `
                <div
                    class="bid-actions"
                    style="margin-top:12px;">

                    ${action}

                </div>
                `
                :
                ""
            }


        </div>

    `;

}


/* =====================================================
   ACCEPT BID
===================================================== */

async function acceptBid(
    bidId,
    projectId
) {

    const confirmed =
        confirm(
            "Are you sure you want to accept this bid?"
        );


    if (!confirmed) return;


    try {

        const response =
            await fetch(
                "/api/contracts/accept-bid",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        bid_id: bidId,

                        client_id:
                            user.user_id

                    })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            showToast(
                data.message ||
                "Failed to accept bid."
            );

            return;

        }


        showToast(
            "Bid accepted! Contract created."
        );


        closeBidsModal();


        await loadProjects();


    } catch (error) {

        console.error(error);

        showToast(
            "Server error. Please try again."
        );

    }

}


/* =====================================================
   COMPLETE PROJECT
===================================================== */

async function completeProject(
    projectId
) {

    const confirmed =
        confirm(
            "Are you sure this project is completed?"
        );


    if (!confirmed) return;


    try {

        const response =
            await fetch(
                `/api/projects/${projectId}/complete`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        user_id:
                            user.user_id

                    })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            showToast(
                data.message ||
                "Failed to complete project."
            );

            return;

        }


        showToast(
            "Project completed successfully!"
        );


        await loadProjects();


    } catch (error) {

        console.error(error);

        showToast(
            "Server error. Please try again."
        );

    }

}


/* =====================================================
   MODALS
===================================================== */

function openCreateModal() {

    document
        .getElementById(
            "createModal"
        )
        .classList.add("show");

}


function closeCreateModal() {

    document
        .getElementById(
            "createModal"
        )
        .classList.remove("show");

}


function closeBidsModal() {

    document
        .getElementById(
            "bidsModal"
        )
        .classList.remove("show");

}


/* Click outside modal */

window.addEventListener(
    "click",
    function(event) {

        const createModal =
            document.getElementById(
                "createModal"
            );


        const bidsModal =
            document.getElementById(
                "bidsModal"
            );


        if (
            event.target === createModal
        ) {

            closeCreateModal();

        }


        if (
            event.target === bidsModal
        ) {

            closeBidsModal();

        }

    }
);


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(date) {

    if (!date) return "N/A";


    const d =
        new Date(date);


    if (isNaN(d.getTime())) {
        return date;
    }


    return d.toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


/* =====================================================
   DATE + TIME
===================================================== */

function formatDateTime(date) {

    if (!date) return "N/A";


    const d =
        new Date(date);


    if (isNaN(d.getTime())) {
        return date;
    }


    return d.toLocaleString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   STATUS FORMAT
===================================================== */

function formatStatus(status) {

    if (!status) return "";


    return status
        .replace("_", " ")
        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "login.html";

}

loadProjects();

loadCategories();
