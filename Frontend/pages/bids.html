<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Bids | Freelancer Marketplace</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f6ff;
            color: #222;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 300px;
            height: 100vh;

            background:
                linear-gradient(
                    160deg,
                    #4f46e5,
                    #6d4ad8 55%,
                    #7c3aed
                );

            padding: 28px 18px;

            color: white;

            overflow-y: auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h2 {
            font-size: 24px;
        }

        .logo p {
            font-size: 12px;
            opacity: .8;
            margin-top: 5px;
        }

        .sidebar a {
            display: block;

            text-decoration: none;
            color: white;

            padding: 13px 16px;

            margin: 6px 0;

            border-radius: 10px;

            transition: .2s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255,255,255,.18);
        }

        .logout {
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,.2);
            padding-top: 20px;
        }


        /* MAIN */

        .main-content {

            margin-left: 300px;

            width: calc(100% - 300px);

            min-height: 100vh;

            padding: 35px 40px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 30px;
            color: #27204f;
        }

        .page-header p {
            color: #777;
            margin-top: 6px;
        }


        /* SUMMARY */

        .summary {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .summary-card {
            background: white;

            padding: 22px;

            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(0,0,0,.07);
        }

        .summary-card h3 {
            font-size: 14px;
            color: #777;
        }

        .summary-card strong {
            display: block;

            font-size: 28px;

            margin-top: 8px;

            color: #5146e5;
        }


        /* BID GRID */

        .bids-grid {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 22px;
        }

        .bid-card {

            background: white;

            border-radius: 16px;

            padding: 24px;

            box-shadow:
                0 8px 25px rgba(0,0,0,.07);

            transition: .2s;
        }

        .bid-card:hover {
            transform: translateY(-3px);
        }

        .bid-card h2 {
            color: #312e81;
            margin-bottom: 10px;
        }

        .category {
            display: inline-block;

            padding: 5px 10px;

            background: #ede9fe;

            color: #5b21b6;

            border-radius: 20px;

            font-size: 12px;

            margin-bottom: 15px;
        }

        .description {
            color: #666;

            line-height: 1.6;

            margin-bottom: 15px;
        }

        .bid-info {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 15px;
        }

        .info-box {
            background: #f8f7ff;

            padding: 12px;

            border-radius: 10px;
        }

        .info-box small {
            color: #777;
        }

        .info-box strong {
            display: block;
            margin-top: 5px;
        }


        /* STATUS */

        .status {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            text-transform: capitalize;
        }

        .pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .accepted {
            background: #ecfdf5;
            color: #047857;
        }

        .rejected {
            background: #fef2f2;
            color: #b91c1c;
        }


        .proposal {

            margin-top: 15px;

            padding: 15px;

            background: #faf9ff;

            border-left: 4px solid #6366f1;

            border-radius: 8px;

            color: #555;

            line-height: 1.6;
        }

        .date {
            margin-top: 15px;

            color: #888;

            font-size: 13px;
        }


        .empty {

            background: white;

            border-radius: 16px;

            padding: 60px 20px;

            text-align: center;

            color: #777;

            box-shadow:
                0 8px 25px rgba(0,0,0,.06);
        }


        /* RESPONSIVE */

        @media(max-width: 900px) {

            .sidebar {
                width: 230px;
            }

            .main-content {
                margin-left: 230px;
                width: calc(100% - 230px);
            }

            .bids-grid {
                grid-template-columns: 1fr;
            }

            .summary {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 650px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 25px 18px;
            }

            .bid-info {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <h2>Freelancer</h2>

        <p>Marketplace</p>

    </div>


    <a href="dashboard.html">
        🏠&nbsp;&nbsp; Dashboard
    </a>

    <a href="projects.html">
        📁&nbsp;&nbsp; Browse Projects
    </a>

    <a href="my-projects.html"
       id="myProjectsLink">
        📂&nbsp;&nbsp; My Projects
    </a>

    <a href="bids.html"
       class="active">
        📜&nbsp;&nbsp; My Bids
    </a>

    <a href="messages.html">
        💬&nbsp;&nbsp; Messages
    </a>

    <a href="notifications.html">
        🔔&nbsp;&nbsp; Notifications
    </a>

    <a href="profile.html">
        👤&nbsp;&nbsp; Profile
    </a>

    <a href="payment.html">
        💳&nbsp;&nbsp; Payment
    </a>

    <a href="contracts.html">
        📄&nbsp;&nbsp; Contracts
    </a>

    <a href="reviews.html">
        ⭐&nbsp;&nbsp; Reviews
    </a>

    <div class="logout">

        <a href="#"
           onclick="logout()">
            🚪&nbsp;&nbsp; Logout
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="main-content">


    <div class="page-header">

        <h1>My Bids</h1>

        <p>
            Track all the projects you have bid on.
        </p>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <h3>Total Bids</h3>

            <strong id="totalBids">
                0
            </strong>

        </div>


        <div class="summary-card">

            <h3>Pending</h3>

            <strong id="pendingBids">
                0
            </strong>

        </div>


        <div class="summary-card">

            <h3>Accepted</h3>

            <strong id="acceptedBids">
                0
            </strong>

        </div>

    </div>


    <!-- BID LIST -->

    <div id="bidsContainer"
         class="bids-grid">

    </div>


</div>


<script>

const user = JSON.parse(
    localStorage.getItem("user")
);


if (!user) {

    window.location.href = "login.html";

}


async function loadMyBids() {

    const container =
        document.getElementById("bidsContainer");

    try {

        const response =
            await fetch(
                `/api/bids/my/${user.user_id}`
            );

        const data =
            await response.json();


        if (!data.success) {

            container.innerHTML = `
                <div class="empty">
                    Failed to load your bids.
                </div>
            `;

            return;
        }


        const bids = data.bids || [];


        /* SUMMARY */

        document.getElementById(
            "totalBids"
        ).textContent = bids.length;


        document.getElementById(
            "pendingBids"
        ).textContent =
            bids.filter(
                b => b.status === "pending"
            ).length;


        document.getElementById(
            "acceptedBids"
        ).textContent =
            bids.filter(
                b => b.status === "accepted"
            ).length;


        if (bids.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h2>No Bids Yet</h2>

                    <p style="margin-top:10px;">
                        Browse projects and place your
                        first bid.
                    </p>
                </div>
            `;

            return;
        }


        container.innerHTML =
            bids.map(bid => `

                <div class="bid-card">

                    <h2>
                        ${escapeHTML(
                            bid.project_title
                        )}
                    </h2>


                    <span class="category">

                        ${escapeHTML(
                            bid.category_name ||
                            "General"
                        )}

                    </span>


                    <p class="description">

                        ${escapeHTML(
                            bid.project_description ||
                            "No description available."
                        )}

                    </p>


                    <div class="bid-info">

                        <div class="info-box">

                            <small>
                                Your Bid
                            </small>

                            <strong>
                                $${Number(
                                    bid.bid_amount
                                ).toFixed(2)}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                Project Budget
                            </small>

                            <strong>
                                $${Number(
                                    bid.project_budget || 0
                                ).toFixed(2)}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                Client
                            </small>

                            <strong>
                                ${escapeHTML(
                                    bid.client_name
                                )}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                Deadline
                            </small>

                            <strong>
                                ${formatDate(
                                    bid.deadline
                                )}
                            </strong>

                        </div>

                    </div>


                    <span class="status ${bid.status}">

                        ${bid.status}

                    </span>


                    <div class="proposal">

                        <strong>
                            Your Proposal
                        </strong>

                        <p style="margin-top:8px;">

                            ${escapeHTML(
                                bid.proposal
                            )}

                        </p>

                    </div>


                    <div class="date">

                        Bid submitted:
                        ${formatDateTime(
                            bid.bid_date
                        )}

                    </div>

                </div>

            `).join("");


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Something went wrong while loading bids.
            </div>
        `;

    }

}


function formatDate(date) {

    if (!date) return "N/A";

    return new Date(date).toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


function formatDateTime(date) {

    if (!date) return "N/A";

    return new Date(date).toLocaleString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function escapeHTML(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function logout() {

    localStorage.removeItem("user");

    window.location.href = "login.html";

}


loadMyBids();

</script>

</body>
</html>
