<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notifications | Freelancer Marketplace</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f6ff;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 300px;
            height: 100vh;

            padding: 30px 20px;

            background:
                linear-gradient(
                    160deg,
                    #4f46e5,
                    #6d4ad8 55%,
                    #7c3aed
                );

            color: white;

            overflow-y: auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h2 {
            font-size: 24px;
        }

        .logo p {
            opacity: 0.8;
        }

        .nav-item {
            display: block;

            padding: 13px 18px;

            margin: 8px 0;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            transition: 0.3s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255,255,255,0.18);
        }


        /* ================= MAIN ================= */

        .main-content {

            margin-left: 300px;

            min-height: 100vh;

            padding: 35px 45px;
        }


        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        .header h1 {
            color: #27204d;
        }

        .header p {
            color: #777;
            margin-top: 6px;
        }


        .user-info {

            background: white;

            padding: 12px 18px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }


        /* ================= TOP BAR ================= */

        .notification-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .notification-header h2 {
            color: #33246b;
        }


        .read-all-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #5b4ce2,
                    #7c3aed
                );

            color: white;

            padding: 11px 18px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;
        }

        .read-all-btn:hover {
            opacity: 0.9;
        }


        /* ================= NOTIFICATIONS ================= */

        .notifications-container {

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .notification {

            background: white;

            padding: 20px 22px;

            border-radius: 15px;

            border: 1px solid #eee;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.05);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            transition: 0.3s;
        }

        .notification:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(79,70,229,0.10);
        }


        .notification.unread {

            border-left: 5px solid #6d4ad8;

            background: #faf9ff;
        }


        .notification-content {

            display: flex;

            align-items: flex-start;

            gap: 15px;

            flex: 1;
        }


        .notification-icon {

            width: 45px;

            height: 45px;

            min-width: 45px;

            border-radius: 50%;

            background: #eee9ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;
        }


        .notification-message {

            color: #33246b;

            font-size: 15px;

            line-height: 1.5;
        }


        .notification-time {

            color: #999;

            font-size: 13px;

            margin-top: 6px;
        }


        .read-btn {

            border: 1px solid #ddd;

            background: white;

            color: #5b4ce2;

            padding: 8px 12px;

            border-radius: 8px;

            cursor: pointer;
        }

        .read-btn:hover {

            background: #f2efff;
        }


        .read-label {

            color: #aaa;

            font-size: 13px;
        }


        /* ================= EMPTY ================= */

        .empty {

            background: white;

            padding: 70px 30px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 7px 25px rgba(0,0,0,0.05);
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty h2 {
            color: #33246b;
            margin-bottom: 8px;
        }

        .empty p {
            color: #888;
        }


        /* ================= MOBILE ================= */

        @media(max-width: 800px) {

            .sidebar {
                width: 230px;
            }

            .main-content {
                margin-left: 230px;
                padding: 25px;
            }

        }


        @media(max-width: 600px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;
            }

            .main-content {

                margin-left: 0;

                padding: 20px;
            }

            .header,
            .notification-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

        }

    </style>

</head>


<body>


<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        <h2>Freelancer</h2>
        <p>Marketplace</p>
    </div>


    <a href="dashboard.html" class="nav-item">
        🏠 Dashboard
    </a>


    <a href="projects.html" class="nav-item">
        📁 Browse Projects
    </a>


    <a href="my-projects.html"
       class="nav-item client-only">
        📂 My Projects
    </a>


    <a href="bids.html" class="nav-item">
        📋 My Bids
    </a>


    <a href="messages.html" class="nav-item">
        💬 Messages
    </a>


    <a href="notifications.html"
       class="nav-item active">
        🔔 Notifications
    </a>


    <a href="profile.html" class="nav-item">
        👤 Profile
    </a>


    <a href="payment.html" class="nav-item">
        💳 Payment
    </a>


    <a href="contracts.html" class="nav-item">
        📄 Contracts
    </a>
<a href="reviews.html" class="nav-item">
    ⭐ Reviews
</a>

    <a href="#" class="nav-item" onclick="logout()">
        🚪 Logout
    </a>

</div>



<!-- ================= MAIN ================= -->

<div class="main-content">


    <div class="header">

        <div>

            <h1>Notifications</h1>

            <p>
                Stay updated with your marketplace activity
            </p>

        </div>


        <div class="user-info">

            <strong id="userName">
                User
            </strong>

            <br>

            <small id="userRole">
                Loading...
            </small>

        </div>

    </div>



    <div class="notification-header">

        <h2>
            Your Notifications
        </h2>

        <button
            class="read-all-btn"
            onclick="markAllRead()">

            ✓ Mark All as Read

        </button>

    </div>



    <div
        id="notificationsContainer"
        class="notifications-container">

    </div>


</div>



<script>

const API = "http://localhost:5000/api";


const user =
    JSON.parse(localStorage.getItem("user"));


if (!user) {

    window.location.href = "login.html";

}


document.getElementById("userName")
    .textContent = user.name;


document.getElementById("userRole")
    .textContent =
        user.role.toUpperCase();



/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications() {

    const container =
        document.getElementById(
            "notificationsContainer"
        );


    try {

        const response =
            await fetch(
                `${API}/notifications/${user.user_id}`
            );


        const data =
            await response.json();


        if (!data.success) {

            container.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h2>
                        Failed to Load
                    </h2>

                    <p>
                        Please try again.
                    </p>

                </div>
            `;

            return;
        }


        if (data.notifications.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        🔔
                    </div>

                    <h2>
                        No Notifications
                    </h2>

                    <p>
                        You don't have any notifications yet.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML =
            data.notifications
            .map(notification => {

                const unread =
                    notification.status === "unread";


                return `

                    <div class="
                        notification
                        ${unread ? "unread" : ""}
                    ">

                        <div class="notification-content">

                            <div class="notification-icon">
                                🔔
                            </div>


                            <div>

                                <div
                                    class="notification-message">

                                    ${escapeHtml(
                                        notification.message
                                    )}

                                </div>


                                <div
                                    class="notification-time">

                                    ${formatDate(
                                        notification.created_at
                                    )}

                                </div>

                            </div>

                        </div>


                        ${
                            unread

                            ? `

                                <button
                                    class="read-btn"
                                    onclick="
                                        markAsRead(
                                            ${notification.notification_id}
                                        )
                                    ">

                                    Mark Read

                                </button>

                            `

                            : `

                                <span class="read-label">
                                    Read
                                </span>

                            `
                        }

                    </div>

                `;

            })
            .join("");


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h2>
                    Server Connection Error
                </h2>

                <p>
                    Make sure the backend server is running.
                </p>

            </div>
        `;
    }

}



/* =========================
   MARK ONE READ
========================= */

async function markAsRead(notificationId) {

    try {

        const response =
            await fetch(
                `${API}/notifications/${notificationId}/read`,
                {
                    method: "PUT"
                }
            );


        const data =
            await response.json();


        if (data.success) {

            loadNotifications();

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);

        alert("Failed to update notification.");

    }

}



/* =========================
   MARK ALL READ
========================= */

async function markAllRead() {

    try {

        const response =
            await fetch(
                `${API}/notifications/user/${user.user_id}/read-all`,
                {
                    method: "PUT"
                }
            );


        const data =
            await response.json();


        if (data.success) {

            loadNotifications();

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);

        alert("Failed to update notifications.");

    }

}



/* =========================
   DATE FORMAT
========================= */

function formatDate(dateValue) {

    if (!dateValue) {
        return "";
    }

    const date =
        new Date(dateValue);


    return date.toLocaleString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}



/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem("user");

    window.location.href = "login.html";
}



/* =========================
   LOAD
========================= */

loadNotifications();

</script>

</body>

</html>
