<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contracts | Freelancer Marketplace</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f6ff;
            color: #222;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 300px;
            height: 100vh;

            background:
                linear-gradient(
                    160deg,
                    #4f46e5,
                    #6d4ad8 55%,
                    #7c3aed
                );

            color: white;

            padding: 28px 18px;

            overflow-y: auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h2 {
            font-size: 24px;
        }

        .logo p {
            font-size: 12px;
            opacity: .8;
            margin-top: 5px;
        }

        .sidebar a {
            display: block;

            color: white;

            text-decoration: none;

            padding: 13px 16px;

            margin: 6px 0;

            border-radius: 10px;

            transition: .2s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255,255,255,.18);
        }

        .logout {
            margin-top: 20px;

            border-top:
                1px solid rgba(255,255,255,.2);

            padding-top: 20px;
        }


        /* =========================
           MAIN
        ========================= */

        .main-content {

            margin-left: 300px;

            width: calc(100% - 300px);

            min-height: 100vh;

            padding: 35px 40px;
        }


        /* =========================
           HEADER
        ========================= */

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {

            color: #27204f;

            font-size: 30px;
        }

        .page-header p {

            color: #777;

            margin-top: 7px;
        }


        /* =========================
           SUMMARY
        ========================= */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .summary-card {

            background: white;

            border-radius: 16px;

            padding: 22px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.06);
        }

        .summary-card h3 {

            color: #777;

            font-size: 14px;
        }

        .summary-card strong {

            display: block;

            margin-top: 8px;

            font-size: 28px;

            color: #5146e5;
        }


        /* =========================
           CONTRACT GRID
        ========================= */

        .contracts-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 22px;
        }


        /* =========================
           CONTRACT CARD
        ========================= */

        .contract-card {

            background: white;

            border-radius: 18px;

            padding: 24px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.07);

            transition: .2s;
        }

        .contract-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(0,0,0,.09);
        }


        .contract-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 14px;
        }


        .project-title {

            color: #312e81;

            font-size: 21px;

            line-height: 1.3;
        }


        /* =========================
           STATUS
        ========================= */

        .status {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            text-transform: capitalize;

            white-space: nowrap;
        }

        .status-active {

            background: #eff6ff;

            color: #2563eb;
        }

        .status-completed {

            background: #ecfdf5;

            color: #047857;
        }

        .status-terminated {

            background: #fef2f2;

            color: #b91c1c;
        }


        /* =========================
           DETAILS
        ========================= */

        .contract-info {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin: 18px 0;
        }

        .info-box {

            background: #f8f7ff;

            padding: 13px;

            border-radius: 10px;
        }

        .info-box small {

            display: block;

            color: #777;

            font-size: 12px;
        }

        .info-box strong {

            display: block;

            margin-top: 5px;

            color: #333;
        }


        /* =========================
           AMOUNT
        ========================= */

        .amount-box {

            background:
                linear-gradient(
                    135deg,
                    #f5f3ff,
                    #ede9fe
                );

            padding: 16px;

            border-radius: 12px;

            margin-bottom: 18px;
        }

        .amount-box small {

            color: #777;
        }

        .amount-box strong {

            display: block;

            color: #5b21b6;

            font-size: 25px;

            margin-top: 5px;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description {

            color: #666;

            line-height: 1.6;

            margin-bottom: 18px;
        }


        /* =========================
           ACTIONS
        ========================= */

        .contract-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 9px;

            padding-top: 17px;

            border-top:
                1px solid #eee;
        }

        .btn {

            border: none;

            padding: 10px 15px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            transition: .2s;

            text-decoration: none;

            display: inline-block;

            font-size: 13px;
        }

        .btn-primary {

            background:
                linear-gradient(
                    135deg,
                    #5146e5,
                    #7c3aed
                );

            color: white;
        }

        .btn-primary:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 7px 18px
                rgba(81,70,229,.25);
        }

        .btn-success {

            background: #dcfce7;

            color: #15803d;
        }

        .btn-success:hover {

            background: #bbf7d0;
        }

        .btn-payment {

            background: #e0f2fe;

            color: #0369a1;
        }

        .btn-review {

            background: #fef3c7;

            color: #92400e;
        }

        .btn-disabled {

            background: #f1f1f1;

            color: #888;

            cursor: default;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            background: white;

            border-radius: 18px;

            padding: 70px 25px;

            text-align: center;

            color: #777;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.06);

            grid-column: 1 / -1;
        }

        .empty h2 {

            color: #312e81;

            margin-bottom: 10px;
        }


        /* =========================
           TOAST
        ========================= */

        .toast {

            position: fixed;

            right: 25px;

            bottom: 25px;

            background: #312e81;

            color: white;

            padding: 14px 20px;

            border-radius: 10px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.18);

            display: none;

            z-index: 2000;
        }

        .toast.show {
            display: block;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 1000px) {

            .sidebar {
                width: 230px;
            }

            .main-content {

                margin-left: 230px;

                width:
                    calc(100% - 230px);
            }

            .contracts-grid {

                grid-template-columns:
                    1fr;
            }

            .summary {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media(max-width: 650px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;
            }

            .main-content {

                margin-left: 0;

                width: 100%;

                padding:
                    25px 18px;
            }

            .summary {

                grid-template-columns:
                    1fr;
            }

            .contract-header {

                flex-direction: column;
            }

            .contract-info {

                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">

    <div class="logo">

        <h2>Freelancer</h2>

        <p>Marketplace</p>

    </div>


    <a href="dashboard.html">
        Dashboard
    </a>


    <a href="projects.html">
        Browse Projects
    </a>


    <a href="my-projects.html"
       id="myProjectsLink">
        My Projects
    </a>


    <a href="bids.html">
        My Bids
    </a>


    <a href="messages.html">
        Messages
    </a>


    <a href="notifications.html">
        Notifications
    </a>


    <a href="profile.html">
        Profile
    </a>


    <a href="payment.html">
        Payment
    </a>


    <a href="contracts.html"
       class="active">
        Contracts
    </a>


    <a href="reviews.html">
        Reviews
    </a>


    <div class="logout">

        <a href="#"
           onclick="logout()">

            Logout

        </a>

    </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main-content">


    <div class="page-header">

        <h1>
            My Contracts
        </h1>

        <p>
            View and manage your project contracts.
        </p>

    </div>


    <!-- SUMMARY -->

    <div class="summary">


        <div class="summary-card">

            <h3>
                Total Contracts
            </h3>

            <strong id="totalContracts">
                0
            </strong>

        </div>


        <div class="summary-card">

            <h3>
                Active Contracts
            </h3>

            <strong id="activeContracts">
                0
            </strong>

        </div>


        <div class="summary-card">

            <h3>
                Completed Contracts
            </h3>

            <strong id="completedContracts">
                0
            </strong>

        </div>


    </div>


    <!-- CONTRACTS -->

    <div
        id="contractsContainer"
        class="contracts-grid">

    </div>


</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    class="toast">

</div>


<script>


/* =====================================================
   USER
===================================================== */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if (!user) {

    window.location.href =
        "login.html";

}


/* =====================================================
   LOAD CONTRACTS
===================================================== */

async function loadContracts() {

    const container =
        document.getElementById(
            "contractsContainer"
        );


    container.innerHTML = `
        <div class="empty">

            <h2>
                Loading Contracts...
            </h2>

        </div>
    `;


    try {

        const response =
            await fetch(
                `/api/contracts/my/${user.user_id}`
            );


        const data =
            await response.json();


        if (!data.success) {

            container.innerHTML = `
                <div class="empty">

                    <h2>
                        Failed to Load Contracts
                    </h2>

                    <p>
                        ${escapeHTML(
                            data.message ||
                            "Something went wrong."
                        )}
                    </p>

                </div>
            `;

            return;
        }


        const contracts =
            data.contracts || [];


        /* SUMMARY */

        document.getElementById(
            "totalContracts"
        ).textContent =
            contracts.length;


        document.getElementById(
            "activeContracts"
        ).textContent =
            contracts.filter(
                c =>
                    c.status === "active"
            ).length;


        document.getElementById(
            "completedContracts"
        ).textContent =
            contracts.filter(
                c =>
                    c.status === "completed"
            ).length;


        if (contracts.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <h2>
                        No Contracts Yet
                    </h2>

                    <p>
                        Contracts will appear here
                        after a bid is accepted.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML =
            contracts.map(
                contract =>
                    createContractCard(
                        contract
                    )
            ).join("");


    } catch (error) {

        console.error(
            "Contracts Error:",
            error
        );


        container.innerHTML = `
            <div class="empty">

                <h2>
                    Server Error
                </h2>

                <p>
                    Could not connect to server.
                </p>

            </div>
        `;

    }

}


/* =====================================================
   CONTRACT CARD
===================================================== */

function createContractCard(
    contract
) {

    const isClient =
        Number(user.user_id) ===
        Number(contract.client_id);


    const otherPerson =
        isClient
            ? contract.freelancer_name
            : contract.client_name;


    const otherEmail =
        isClient
            ? contract.freelancer_email
            : contract.client_email;


    let actions = "";


    /* ACTIVE */

    if (
        contract.status === "active"
    ) {

        actions += `

            <button
                class="btn btn-success"
                onclick="
                    completeProject(
                        ${contract.project_id}
                    )
                ">

                Mark Project Completed

            </button>

        `;

    }


    /* COMPLETED */

    if (
        contract.status === "completed"
    ) {

        actions += `

            <a
                href="reviews.html"
                class="btn btn-review">

                Leave Review

            </a>

        `;

    }


    /* PAYMENT */

    actions += `

        <a
            href="payment.html"
            class="btn btn-payment">

            Payment

        </a>

    `;


    return `

        <div class="contract-card">


            <div class="contract-header">


                <div>

                    <h2 class="project-title">

                        ${escapeHTML(
                            contract.project_title ||
                            "Untitled Project"
                        )}

                    </h2>


                    <p
                        style="
                            color:#888;
                            font-size:13px;
                            margin-top:6px;
                        ">

                        Contract #${contract.contract_id}

                    </p>

                </div>


                <span
                    class="
                        status
                        status-${contract.status}
                    ">

                    ${formatStatus(
                        contract.status
                    )}

                </span>


            </div>


            <p class="description">

                ${escapeHTML(
                    contract.project_description ||
                    "No project description available."
                )}

            </p>


            <div class="amount-box">

                <small>
                    Contract Amount
                </small>

                <strong>
                    $${Number(
                        contract.payment_amount || 0
                    ).toFixed(2)}
                </strong>

            </div>


            <div class="contract-info">


                <div class="info-box">

                    <small>
                        ${isClient
                            ? "Freelancer"
                            : "Client"}
                    </small>

                    <strong>

                        ${escapeHTML(
                            otherPerson ||
                            "Unknown"
                        )}

                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Email
                    </small>

                    <strong>

                        ${escapeHTML(
                            otherEmail ||
                            "N/A"
                        )}

                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Start Date
                    </small>

                    <strong>

                        ${formatDate(
                            contract.start_date
                        )}

                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        End Date
                    </small>

                    <strong>

                        ${formatDate(
                            contract.end_date
                        )}

                    </strong>

                </div>


            </div>


            <div
                style="
                    color:#888;
                    font-size:12px;
                    margin-bottom:15px;
                ">

                Created:
                ${formatDateTime(
                    contract.created_at
                )}

            </div>


            <div class="contract-actions">

                ${actions}

            </div>


        </div>

    `;

}


/* =====================================================
   COMPLETE PROJECT
===================================================== */

async function completeProject(
    projectId
) {

    const confirmed =
        confirm(
            "Are you sure this project has been completed?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/projects/${projectId}/complete`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                user.user_id

                        })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            showToast(
                data.message ||
                "Failed to complete project."
            );

            return;

        }


        showToast(
            "Project completed successfully!"
        );


        setTimeout(
            () => {
                loadContracts();
            },
            500
        );


    } catch (error) {

        console.error(
            "Complete Project Error:",
            error
        );


        showToast(
            "Server error. Please try again."
        );

    }

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    date
) {

    if (!date) {
        return "N/A";
    }


    const d =
        new Date(date);


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return date;

    }


    return d.toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


/* =====================================================
   DATE + TIME
===================================================== */

function formatDateTime(
    date
) {

    if (!date) {
        return "N/A";
    }


    const d =
        new Date(date);


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return date;

    }


    return d.toLocaleString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   STATUS
===================================================== */

function formatStatus(
    status
) {

    if (!status) {
        return "";
    }


    return status
        .replace(
            "_",
            " "
        )
        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "user"
    );


    window.location.href =
        "login.html";

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadContracts();

</script>


</body>

</html>
